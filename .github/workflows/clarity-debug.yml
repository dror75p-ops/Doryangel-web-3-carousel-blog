name: clarity-debug
# Throwaway: probe the Microsoft Clarity Data Export API from a runner
# (open network), since the dev sandbox cannot reach clarity.ms.
# Remove after verification.
on:
  push:
    branches:
      - claude/doryangel-performance-clarity-y8jaxs
    paths:
      - .github/workflows/clarity-debug.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call Clarity Data Export API
        run: |
          TOKEN="x7y1bk4fhc"
          echo "Using token of length ${#TOKEN}"
          for DAYS in 1 3; do
            echo "======================================================"
            echo "GET project-live-insights numOfDays=$DAYS dimension1=OS"
            echo "------------------------------------------------------"
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
              -H "Authorization: Bearer $TOKEN" \
              "https://www.clarity.ms/export-data/api/v1/project-live-insights?numOfDays=$DAYS&dimension1=OS" \
              || echo "curl failed"
          done
