name: perf-watch
# Throwaway probe: Lighthouse on the live homepage (mobile), with per-file detail.
on:
  push:
    branches:
      - claude/perf-probe
    paths:
      - .github/workflows/perf-watch.yml
      - .perf-nonce

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Install Lighthouse
        run: npm install -g lighthouse@11
      - name: Measure live mobile with detail
        run: |
          lighthouse "https://www.doryangel.com/?lh=$RANDOM" --quiet --only-categories=performance \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" --output=json --output-path=./lh.json 2>/dev/null
          node -e '
            const r=require("./lh.json"),a=r.audits,g=id=>(a[id]&&a[id].displayValue)||"n/a";
            console.log("SCORE "+Math.round(r.categories.performance.score*100)+" FCP "+g("first-contentful-paint")+" LCP "+g("largest-contentful-paint")+" TBT "+g("total-blocking-time")+" CLS "+g("cumulative-layout-shift")+" SI "+g("speed-index")+" weight "+g("total-byte-weight"));
            const show=(id,f)=>{const d=a[id]&&a[id].details;if(!d)return;console.log("== "+id);(d.items||[]).slice(0,10).forEach(i=>console.log("  "+f(i)));};
            show("unused-javascript",i=>Math.round(i.wastedBytes/1024)+"KB unused of "+Math.round(i.totalBytes/1024)+"KB "+String(i.url).slice(0,110));
            show("bootup-time",i=>Math.round(i.total)+"ms (script "+Math.round(i.scripting)+") "+String(i.url).slice(0,110));
            show("third-party-summary",i=>Math.round(i.mainThreadTime)+"ms main, "+Math.round(i.transferSize/1024)+"KB "+(i.entity&&i.entity.text||i.entity));
            show("uses-responsive-images",i=>Math.round(i.wastedBytes/1024)+"KB extra "+String(i.url).slice(0,110));
            show("offscreen-images",i=>Math.round(i.wastedBytes/1024)+"KB "+String(i.url).slice(0,110));
            show("layout-shifts",i=>(i.score||0).toFixed(3)+" "+(i.node&&i.node.selector));
            show("largest-contentful-paint-element",i=>JSON.stringify(i).slice(0,160));
            const n=(a["network-requests"].details.items||[]).sort((x,y)=>y.transferSize-x.transferSize).slice(0,12);
            console.log("== biggest downloads");n.forEach(i=>console.log("  "+Math.round(i.transferSize/1024)+"KB "+String(i.url).slice(0,110)));
            const lt=(a["long-tasks"].details.items||[]).slice(0,8);console.log("== long tasks");lt.forEach(i=>console.log("  "+Math.round(i.duration)+"ms "+String(i.url).slice(0,100)));
          '
