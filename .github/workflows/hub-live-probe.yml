name: hub-live-probe (throwaway)

on:
  push:
    branches: [claude/doryangel-traffic-decline-xp2g4p]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm /blog/ hub is live and crawlable
        run: |
          set +e
          UA="Mozilla/5.0 hub-live-probe"
          URL="https://www.doryangel.com/blog/"
          # Vercel may still be deploying right after merge — poll up to ~2.5 min.
          for i in $(seq 1 15); do
            code=$(curl -sS -A "$UA" -o /tmp/hub.html -w '%{http_code}' -L "$URL")
            links=$(grep -c 'class="hub-link" href="/blog/' /tmp/hub.html)
            echo "attempt $i: HTTP $code, hub post-links=$links"
            if [ "$code" = "200" ] && [ "$links" -ge 58 ]; then break; fi
            sleep 10
          done
          echo "==================================================================="
          echo "FINAL status: HTTP $code"
          echo "crawlable post links in hub: $links (expected 58)"
          echo "noindex present? -> $(grep -ioc 'noindex' /tmp/hub.html)"
          grep -ioE '<link[^>]*rel=["'"'"']canonical["'"'"'][^>]*>' /tmp/hub.html | head -1 | sed 's/\r$//'
          grep -ioE '<title>[^<]*</title>' /tmp/hub.html | head -1 | sed 's/\r$//'
          echo "JSON-LD types: $(grep -oE '"@type": "(CollectionPage|ItemList|BreadcrumbList)"' /tmp/hub.html | tr '\n' ' ')"
          echo "--- sitemap lists /blog/ ? ---"
          curl -sS -A "$UA" "https://www.doryangel.com/sitemap.xml" | grep -o '<loc>https://www.doryangel.com/blog/</loc>' | head -1
          echo "--- homepage static 'Browse all articles' link present? ---"
          curl -sS -A "$UA" "https://www.doryangel.com/" | grep -oE 'href="/blog/"[^>]*blog-masthead-all|Browse all articles' | head -1
          echo "done."
