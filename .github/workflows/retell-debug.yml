name: Retell Debug (temporary)

on:
  push:
    branches:
      - claude/rettel-agent-repo-chat-hfk7rf

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inspect widget JS for mount element and API paths
        run: |
          curl -sS https://dashboard.retellai.com/retell-widget-v2.js -o /tmp/widget.js
          echo "widget.js size: $(wc -c < /tmp/widget.js) bytes"
          echo "--- custom elements defined ---"
          grep -oE 'customElements\.define\("[^"]+"' /tmp/widget.js | sort -u || true
          echo "--- api path strings ---"
          grep -oE '"/[a-z0-9_-]*(chat|call|session|widget)[a-z0-9/_-]*"' /tmp/widget.js | sort -u | head -20 || true
          echo "--- agent/public key param names ---"
          grep -oE '"[a-z_]*(public_key|agent_id)[a-z_]*"' /tmp/widget.js | sort -u | head || true

      - name: Browser reproduction against LIVE site
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core >/dev/null 2>&1
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "using chrome at: $CHROME_PATH"
          export TARGET_URL="https://www.doryangel.com/"
          CHROME_PATH="$CHROME_PATH" node scripts/retell-debug.mjs
