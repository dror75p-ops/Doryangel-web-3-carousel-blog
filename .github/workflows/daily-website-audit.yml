name: Daily Website Audit & Improvement

on:
  schedule:
    # Runs every day at 9 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'
        type: string

concurrency:
  group: daily-audit
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          GSC_SITE_URL: 'sc-domain:doryangel.com'
        run: node scripts/daily-audit.js

      # Separate, decision-focused message. The script sends only when the
      # recommendations file was generated today, so this does not create a
      # daily nag. It contains no approval link/webhook and cannot queue work.
      - name: Send Arlo approval decision email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/arlo-approval-reminder.js

      - name: Commit rank history
        run: |
          if [ ! -f project/seo/rank-history.json ] && [ ! -f project/seo/improvement-state.json ]; then
            echo "Nothing written under project/seo — Search Console not connected yet."
            exit 0
          fi
          git config user.name "Arlo (DoryAngel Bot)"
          git config user.email "office@doryangel.com"
          for f in project/seo/rank-history.json \
                   project/seo/daily-series.json \
                   project/seo/query-series.json \
                   project/seo/annotations.json \
                   project/seo/improvement-state.json \
                   project/seo/recommendations.json \
                   project/seo/experiments.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && echo "No new snapshot today" && exit 0
          git commit -m "Arlo: rank snapshot $(date +'%Y-%m-%d')"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Commit improvements and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DID_CHANGE=$(cat /tmp/audit-changed.txt 2>/dev/null || echo "false")

          if [ "$DID_CHANGE" = "true" ]; then
            TASK=$(cat /tmp/audit-task.txt 2>/dev/null || echo "daily improvement")
            BRANCH="claude/daily-audit-$(date +'%Y-%m-%d')"

            git config user.name "Arlo (DoryAngel Bot)"
            git config user.email "office@doryangel.com"

            git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
            git add -A
            git commit -m "Auto-improve: $TASK" || echo "Nothing new to commit"
            git push --force origin "$BRANCH"

            PR_URL=$(gh pr create \
              --title "Auto-improve: $TASK" \
              --body "Auto-implemented by Arlo, DoryAngel's daily audit agent. Review the diff and merge to apply. Generated on $(date +'%Y-%m-%d')." \
              --head "$BRANCH" \
              --base main 2>&1) && echo "PR opened: $PR_URL" || echo "PR not created (may already exist): $PR_URL"
          else
            echo "No code changes today — GitHub Issue was created instead."
          fi
