name: clarity-pull (throwaway)
on:
  push:
    branches: [claude/doryangel-traffic-decline-xp2g4p]
jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
    steps:
      - name: Pull Clarity 3-day live insights
        run: |
          set +e
          BASE="https://www.clarity.ms/export-data/api/v1/project-live-insights"
          call() {
            local label="$1" url="$2"
            echo "==================================================================="
            echo "### $label"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -H "Authorization: Bearer $CLARITY_API_TOKEN" "$url")
            echo "HTTP $code"
            if command -v jq >/dev/null && jq -e . /tmp/resp.json >/dev/null 2>&1; then
              jq -c '.[]' /tmp/resp.json 2>/dev/null || jq . /tmp/resp.json
            else
              cat /tmp/resp.json
            fi
            echo ""
          }
          call "OVERALL (3 days, no dimension)" "$BASE?numOfDays=3"
          call "BY URL (top pages)"            "$BASE?numOfDays=3&dimension1=URL"
          call "BY SOURCE (traffic sources)"   "$BASE?numOfDays=3&dimension1=Source"
          call "BY DEVICE"                     "$BASE?numOfDays=3&dimension1=Device"
          echo "done. (used 4 of 10 daily calls)"
