name: Verify Clarity live check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production homepage and check for unconditional loadClarity()
        run: |
          curl -sSL -o page.html https://www.doryangel.com/
          echo "--- HTTP status ---"
          curl -sSL -o /dev/null -w "%{http_code}\n" https://www.doryangel.com/
          echo "--- marker comment check ---"
          if grep -q "Clarity loads on every visit in cookieless mode" page.html; then
            echo "PASS: unconditional-load marker found in deployed HTML"
          else
            echo "FAIL: marker not found"
            exit 1
          fi
          echo "--- surrounding script snippet ---"
          grep -n "loadClarity" page.html || true
