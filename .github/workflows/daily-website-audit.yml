name: Daily Website Audit & Improvement

on:
  schedule:
    # Runs every day at 9 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'
        type: string

concurrency:
  group: daily-audit
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # A backstop, not the real fix — the per-request timeouts in daily-audit.js
    # are. Without this the job inherits GitHub's 360-minute default, so a hang
    # burns six hours of runner time before anyone hears about it. With it, a
    # stuck run fails as a timeout that names itself instead of the bare
    # "cancelled" with no logs that run 31118286414 produced on 2026-08-06.
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # buildAnnotations() runs `git log --since="<backfill> days ago"` to
          # derive the change log that daily-series.json is read against.
          # checkout defaults to a depth-1 shallow clone, so that log returned a
          # single commit — filtered out as noise — and annotations.json was
          # written empty every run with no error anywhere. Full history is the
          # only thing that makes the file mean anything.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          # Must be the sc-domain: form — the owner's Search Console property is
          # a Domain property, and a URL-prefix value 403s against it. Not a
          # secret, so it is a plain literal.
          GSC_SITE_URL: 'sc-domain:doryangel.com'
        run: node scripts/daily-audit.js

      # ⚠️ Separate from the PR step below, and deliberately unconditional.
      # That step only runs when an auto-task fired, which is the minority of
      # days — so if the rank snapshot rode along with it, it would be thrown
      # away with the runner on every other day and the trend would never
      # accumulate. This is the category-plan.json lesson: anything written on
      # the runner has to be committed or it does not exist.
      - name: Commit rank history
        run: |
          if [ ! -f project/seo/rank-history.json ]; then
            echo "No rank history written — Search Console not connected yet."
            exit 0
          fi
          git config user.name "Arlo (DoryAngel Bot)"
          git config user.email "office@doryangel.com"
          # ⚠️ ALL FOUR of these are written on the runner and all four must be
          # added here. daily-series.json is the per-day (non-overlapping) history
          # and query-series.json the per-term one; leaving either out of this line
          # means the backfill is re-fetched and re-thrown-away every single day,
          # and no trend ever accumulates — the exact bug that `git add` line
          # already exists to prevent for rank-history.json.
          git add project/seo/rank-history.json \
                  project/seo/daily-series.json \
                  project/seo/query-series.json \
                  project/seo/annotations.json
          git diff --staged --quiet && echo "No new snapshot today" && exit 0
          git commit -m "Arlo: rank snapshot $(date +'%Y-%m-%d')"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Commit improvements and open PR
        env:
          # Use the workflow's built-in GITHUB_TOKEN (has contents+pull-requests write)
          # for both push and PR creation. The standalone GH_TOKEN secret was expired
          # (401 Bad credentials), which silently broke PR creation for weeks.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DID_CHANGE=$(cat /tmp/audit-changed.txt 2>/dev/null || echo "false")

          if [ "$DID_CHANGE" = "true" ]; then
            TASK=$(cat /tmp/audit-task.txt 2>/dev/null || echo "daily improvement")
            BRANCH="claude/daily-audit-$(date +'%Y-%m-%d')"

            git config user.name "Arlo (DoryAngel Bot)"
            git config user.email "office@doryangel.com"

            git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
            git add -A
            git commit -m "Auto-improve: $TASK" || echo "Nothing new to commit"
            git push --force origin "$BRANCH"

            # Create the PR with the gh CLI (authenticates via GH_TOKEN = GITHUB_TOKEN).
            # If a PR already exists for this branch, gh exits non-zero — treat as success.
            PR_URL=$(gh pr create \
              --title "Auto-improve: $TASK" \
              --body "Auto-implemented by Arlo, DoryAngel's daily audit agent. Review the diff and merge to apply. Generated on $(date +'%Y-%m-%d')." \
              --head "$BRANCH" \
              --base main 2>&1) && echo "PR opened: $PR_URL" || echo "PR not created (may already exist): $PR_URL"
          else
            echo "No code changes today — GitHub Issue was created instead."
          fi
