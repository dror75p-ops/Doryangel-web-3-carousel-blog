name: redirect-probe (throwaway)

on:
  push:
    branches: [claude/doryangel-traffic-decline-xp2g4p]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live redirect chains + indexability
        run: |
          set +e
          probe() {
            local label="$1"; local url="$2"
            echo "==================================================================="
            echo "### $label"
            echo "    URL: $url"
            echo "--- redirect chain (status -> location) ---"
            curl -sS -A "Mozilla/5.0 redirect-probe" -o /dev/null \
              -w '%{http_code}  %{url_effective}\n' -L --max-redirs 10 \
              --write-out '' "$url"
            # Show each hop explicitly
            curl -sS -A "Mozilla/5.0 redirect-probe" -D - -o /dev/null -L --max-redirs 10 "$url" 2>&1 \
              | grep -iE '^(HTTP/|location:)' | sed 's/\r$//'
            echo ""
          }

          probe "APEX HTTP  (carried 82% of June clicks)" "http://doryangel.com/"
          probe "APEX HTTPS" "https://doryangel.com/"
          probe "WWW HTTP" "http://www.doryangel.com/"
          probe "WWW HTTPS (canonical home)" "https://www.doryangel.com/"
          probe "BETA (should redirect to www)" "https://beta.doryangel.com/"
          probe "OLD WIX /post/ URL (should 301 -> /blog/)" "https://www.doryangel.com/post/how-to-screen-tenants-in-nyc-without-getting-sued-a-bronx-landlord-s-checklist"
          probe "NEW /blog/ post" "https://www.doryangel.com/blog/tenant-screening-bronx-landlord-guide/"

          echo "==================================================================="
          echo "### HOMEPAGE indexability (headers + meta robots + canonical)"
          echo "--- response headers for https://www.doryangel.com/ ---"
          curl -sS -A "Mozilla/5.0 redirect-probe" -D - -o /tmp/home.html -L "https://www.doryangel.com/" \
            | grep -iE '^(HTTP/|x-robots-tag|content-type|x-vercel|cache-control|location):' | sed 's/\r$//'
          echo ""
          echo "--- <title>, robots meta, canonical, GA id in delivered HTML ---"
          grep -ioE '<title>[^<]*</title>' /tmp/home.html | head -1
          grep -ioE '<meta[^>]*name=["'"'"']robots["'"'"'][^>]*>' /tmp/home.html | head -3
          echo "noindex present? -> $(grep -ioc 'noindex' /tmp/home.html)"
          grep -ioE '<link[^>]*rel=["'"'"']canonical["'"'"'][^>]*>' /tmp/home.html | head -1
          echo "GA G-0W61NYHM78 present? -> $(grep -oc 'G-0W61NYHM78' /tmp/home.html)"
          echo "bytes downloaded: $(wc -c < /tmp/home.html)"

          echo "==================================================================="
          echo "### robots.txt + sitemap reachability"
          curl -sS -o /dev/null -w 'robots.txt   -> HTTP %{http_code}\n' "https://www.doryangel.com/robots.txt"
          curl -sS -o /dev/null -w 'sitemap.xml  -> HTTP %{http_code}\n' "https://www.doryangel.com/sitemap.xml"
          echo "done."
